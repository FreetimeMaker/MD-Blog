<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <link rel="stylesheet" href="/styles/style.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicons/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicons/android-chrome-512x512.png">
  <link rel="icon" type="image/x-icon" href="/favicons/favicon.ico">
  <link rel="manifest" href="/favicons/site.webmanifest">
</head>
<body>
  <button class="theme-toggle" onclick="toggleDarkMode()">🌓 Toggle Theme</button>
  <button class="navigate-btn" onclick="location.href='/blog'">Blogs</button>

  <div class="content">
    <h1><strong>{{title}}</strong></h1>
    {{content}}
  </div>

  <footer>Powered by <strong>mdxpress</strong> &copy; 2026 FreetimeMaker</footer>

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const theme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
      localStorage.setItem('theme', theme);
    }

    function formatRelativeTime(date, locale) {
      const diffSeconds = Math.round((date.getTime() - Date.now()) / 1000);
      const rtf = new Intl.RelativeTimeFormat(locale, { numeric: 'auto' });

      if (Math.abs(diffSeconds) < 60) return rtf.format(diffSeconds, 'second');
      const minutes = Math.round(diffSeconds / 60);
      if (Math.abs(minutes) < 60) return rtf.format(minutes, 'minute');
      const hours = Math.round(minutes / 60);
      if (Math.abs(hours) < 24) return rtf.format(hours, 'hour');
      const days = Math.round(hours / 24);
      if (Math.abs(days) < 30) return rtf.format(days, 'day');
      const months = Math.round(days / 30);
      if (Math.abs(months) < 12) return rtf.format(months, 'month');
      const years = Math.round(days / 365);
      return rtf.format(years, 'year');
    }

    function updateTimestamps() {
      const locale = navigator.language || 'en';

      document.querySelectorAll('.discord-timestamp').forEach(element => {
        const date = new Date(Number(element.dataset.timestamp) * 1000);
        const style = element.dataset.style || 'f';
        let value;

        switch (style) {
          case 't':
            value = date.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
            break;
          case 'T':
            value = date.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            break;
          case 'd':
            value = date.toLocaleDateString(locale, { year: 'numeric', month: '2-digit', day: '2-digit' });
            break;
          case 'D':
            value = date.toLocaleDateString(locale, { year: 'numeric', month: 'long', day: 'numeric' });
            break;
          case 'F':
            value = date.toLocaleString(locale, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            break;
          case 'R':
            value = formatRelativeTime(date, locale);
            break;
          case 'f':
          default:
            value = date.toLocaleString(locale, { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        element.textContent = value;
        element.dateTime = date.toISOString();
        element.title = date.toLocaleString(locale);
      });
    }

    updateTimestamps();
    setInterval(updateTimestamps, 30000);
  </script>
</body>
</html>
